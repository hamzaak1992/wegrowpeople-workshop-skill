<!doctype html><html><head><meta charset="utf-8"><title>Your AI System</title>
<style>
:root{--cream:#f8f4ea;--ink:#1c1b16;--dim:#6f6b5e;--sage:#5f7355;--font:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;}
*{box-sizing:border-box;}
body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--font);line-height:1.5;}
.wrap{max-width:920px;margin:0 auto;padding:26px 16px 50px;}
.head{text-align:center;margin-bottom:6px;}
.eye{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--sage);}
h1{font-size:25px;margin:8px 0 3px;}
.head p{color:var(--dim);font-size:13.5px;margin:0;}
.prog{display:inline-flex;align-items:center;gap:8px;margin-top:12px;background:#fffdf8;border:1px solid #e7e2d5;border-radius:999px;padding:6px 8px 6px 14px;font-size:12.5px;font-weight:700;color:var(--dim);}
.prog b{color:var(--ink);}.pdots{display:flex;gap:5px;}.pd{width:9px;height:9px;border-radius:50%;background:#e7e2d5;}.pd.on{background:var(--sage);}
.scroll{overflow-x:auto;}
svg.diagram{display:block;width:100%;height:auto;min-width:660px;}
</style></head><body><div class="wrap">

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <g id="i-brain" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
    <path d="M9 3.5c-2 0-3 1.4-3 3 0 .4-1.5.6-1.5 2.3 0 1 .7 1.5.7 1.5s-.9.6-.9 1.9c0 1.4 1.2 2 1.2 2s-.2 1.7 1.8 2.2c.6 1.4 2 1.6 3 1.1"/>
    <path d="M15 3.5c2 0 3 1.4 3 3 0 .4 1.5.6 1.5 2.3 0 1-.7 1.5-.7 1.5s.9.6.9 1.9c0 1.4-1.2 2-1.2 2s.2 1.7-1.8 2.2c-.6 1.4-2 1.6-3 1.1"/>
    <line x1="12" y1="3.5" x2="12" y2="20.5"/><rect x="10" y="9.5" width="4" height="5" rx="1" fill="currentColor" stroke="none"/>
  </g>
  <g id="i-skill" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
    <rect x="4" y="3" width="16" height="18" rx="2.5"/><line x1="7.5" y1="8" x2="16.5" y2="8"/><line x1="7.5" y1="12" x2="13" y2="12"/><path d="M7.5 16.5l1.6 1.6 3.4-3.6"/>
  </g>
  <g id="i-plug" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
    <path d="M8.5 3.5v4M15.5 3.5v4"/><path d="M6 7.5h12v3a6 6 0 0 1-6 6 6 6 0 0 1-6-6z"/><line x1="12" y1="16.5" x2="12" y2="21"/>
  </g>
  <g id="i-agents" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
    <circle cx="7" cy="8" r="2.4"/><circle cx="17" cy="8" r="2.4"/><circle cx="12" cy="7" r="2.6"/><path d="M3.5 18c0-2.5 1.8-4 3.5-4M20.5 18c0-2.5-1.8-4-3.5-4M8 19c0-3 2-4.5 4-4.5s4 1.5 4 4.5"/>
  </g>
  <g id="i-brief" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
    <rect x="3.5" y="6" width="17" height="12" rx="2.5"/><path d="M4.5 8l7.5 5 7.5-5"/><circle cx="18.5" cy="6" r="3.4" fill="#f8e3d1"/><path d="M18.5 4.4v1.7l1.1.9"/>
  </g>
  <g id="i-dash" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
    <rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><line x1="3.5" y1="9" x2="20.5" y2="9"/><line x1="8" y1="16" x2="8" y2="13"/><line x1="12" y1="16" x2="12" y2="11.5"/><line x1="16" y1="16" x2="16" y2="12.5"/>
  </g>
  <g id="i-check" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"><path d="M5 12.5l4 4 10-10"/></g>
  <marker id="ah-2" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c99a1e"/></marker>
  <marker id="ah-3" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b74c4"/></marker>
  <marker id="ah-4" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6bd1"/></marker>
  <marker id="ah-5" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2703e"/></marker>
  <marker id="ah-6" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c05a86"/></marker>
</defs></svg>

<div class="head">
  <div class="eye">WeGrowPeople &middot; Today's Build</div>
  <h1>Aisha's AI System</h1>
  <p>Your AI Brain in the middle. Everything you build today plugs into it.</p>
  <div class="prog"><span><b>3</b> of 6 done</span>
    <span class="pdots"><i class="pd on"></i><i class="pd on"></i><i class="pd on"></i><i class="pd"></i><i class="pd"></i><i class="pd"></i></span></div>
</div>

<div class="scroll">

  <line x1="460.0" y1="242.0" x2="460.0" y2="155.0" stroke="#c99a1e" stroke-width="3.5" stroke-linecap="round" marker-end="url(#ah-2)"/>
  <line x1="553.2" y1="309.7" x2="635.9" y2="282.8" stroke="#5b74c4" stroke-width="3.5" stroke-linecap="round" marker-end="url(#ah-3)"/>
  <line x1="517.6" y1="419.3" x2="568.7" y2="489.7" stroke="#8a6bd1" stroke-width="3.5" stroke-linecap="round" marker-end="url(#ah-4)" stroke-dasharray="2 7"/>
  <line x1="402.4" y1="419.3" x2="351.3" y2="489.7" stroke="#c2703e" stroke-width="3.5" stroke-linecap="round" marker-end="url(#ah-5)" stroke-dasharray="2 7"/>
  <line x1="366.8" y1="309.7" x2="284.1" y2="282.8" stroke="#c05a86" stroke-width="3.5" stroke-linecap="round" marker-end="url(#ah-6)" stroke-dasharray="2 7"/>

  <!-- central AI Brain hub -->
  <circle cx="460" cy="340" r="92" fill="var(--sage)" stroke="#4c5c44" stroke-width="3"/>
  <circle cx="460" cy="340" r="101" fill="none" stroke="var(--sage)" stroke-width="2" opacity=".28"/>
  <g transform="translate(434,300)" color="#fff"><svg width="52" height="52" viewBox="0 0 24 24" style="overflow:visible"><use href="#i-brain"/></svg></g>
  <text x="460" y="374" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="900" font-size="16">AI BRAIN</text>
  <text x="460" y="393" text-anchor="middle" fill="rgba(255,255,255,.8)" font-family="Arial" font-weight="700" font-size="10.5">STEP 1 &#183; Aisha's firm</text>

  <g transform="translate(372.0,79.0)">
    <rect width="176" height="62" rx="15" fill="#c99a1e" />
    <rect x="12" y="12" width="38" height="38" rx="10" fill="rgba(255,255,255,.25)"/>
    <g transform="translate(19,19) scale(1.0)" color="#fff"><svg x="0" y="0" width="24" height="24" viewBox="0 0 24 24" style="overflow:visible"><use href="#i-skill"/></svg></g>
    <text x="62" y="25" fill="#fff" font-family="Arial" font-weight="800" font-size="11" letter-spacing=".5">STEP 2</text>
    <text x="62" y="44" fill="#fff" font-family="Arial" font-weight="800" font-size="15">First skill</text>
    <g transform="translate(150,23) scale(0.7)" color="#fff"><svg width="24" height="24" viewBox="0 0 24 24" style="overflow:visible"><use href="#i-check"/></svg></g>
  </g>
  <g transform="translate(590.7,237.9)">
    <rect width="176" height="62" rx="15" fill="#5b74c4" />
    <rect x="12" y="12" width="38" height="38" rx="10" fill="rgba(255,255,255,.25)"/>
    <g transform="translate(19,19) scale(1.0)" color="#fff"><svg x="0" y="0" width="24" height="24" viewBox="0 0 24 24" style="overflow:visible"><use href="#i-plug"/></svg></g>
    <text x="62" y="25" fill="#fff" font-family="Arial" font-weight="800" font-size="11" letter-spacing=".5">STEP 3</text>
    <text x="62" y="44" fill="#fff" font-family="Arial" font-weight="800" font-size="15">Connect tools</text>
    <g transform="translate(150,23) scale(0.7)" color="#fff"><svg width="24" height="24" viewBox="0 0 24 24" style="overflow:visible"><use href="#i-check"/></svg></g>
  </g>
  <g transform="translate(507.2,495.1)">
    <rect width="176" height="62" rx="15" fill="#ece3fb" stroke="#8a6bd1" stroke-width="2" stroke-dasharray="4 4"/>
    <rect x="12" y="12" width="38" height="38" rx="10" fill="#fff"/>
    <g transform="translate(19,19) scale(1.0)" color="#8a6bd1"><svg x="0" y="0" width="24" height="24" viewBox="0 0 24 24" style="overflow:visible"><use href="#i-agents"/></svg></g>
    <text x="62" y="25" fill="#8a6bd1" font-family="Arial" font-weight="800" font-size="11" letter-spacing=".5">STEP 4  ·  NEXT</text>
    <text x="62" y="44" fill="#8a6bd1" font-family="Arial" font-weight="800" font-size="15">Agents</text>
    
  </g>
  <g transform="translate(236.8,495.1)">
    <rect width="176" height="62" rx="15" fill="#f8e3d1" stroke="#c2703e" stroke-width="2" stroke-dasharray="4 4"/>
    <rect x="12" y="12" width="38" height="38" rx="10" fill="#fff"/>
    <g transform="translate(19,19) scale(1.0)" color="#c2703e"><svg x="0" y="0" width="24" height="24" viewBox="0 0 24 24" style="overflow:visible"><use href="#i-brief"/></svg></g>
    <text x="62" y="25" fill="#c2703e" font-family="Arial" font-weight="800" font-size="11" letter-spacing=".5">STEP 5  ·  NEXT</text>
    <text x="62" y="44" fill="#c2703e" font-family="Arial" font-weight="800" font-size="15">Morning brief</text>
    
  </g>
  <g transform="translate(153.3,237.9)">
    <rect width="176" height="62" rx="15" fill="#f8dbe8" stroke="#c05a86" stroke-width="2" stroke-dasharray="4 4"/>
    <rect x="12" y="12" width="38" height="38" rx="10" fill="#fff"/>
    <g transform="translate(19,19) scale(1.0)" color="#c05a86"><svg x="0" y="0" width="24" height="24" viewBox="0 0 24 24" style="overflow:visible"><use href="#i-dash"/></svg></g>
    <text x="62" y="25" fill="#c05a86" font-family="Arial" font-weight="800" font-size="11" letter-spacing=".5">STEP 6  ·  NEXT</text>
    <text x="62" y="44" fill="#c05a86" font-family="Arial" font-weight="800" font-size="15">Dashboard</text>
    
  </g>
</svg>
</div>

</div></body></html>
