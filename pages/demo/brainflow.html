<!doctype html><html><head><meta charset="utf-8"><title>Your AI System</title>
<style>
:root{--cream:#f8f4ea;--ink:#17170f;--dim:#6b6b5e;}
*{box-sizing:border-box;}
html,body{margin:0;background:var(--cream);color:var(--ink);font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;}
.wrap{max-width:1180px;margin:0 auto;padding:18px 12px 40px;}
.head{text-align:center;margin-bottom:6px;}
.head .eye{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#5f7355;}
.head h1{font-size:24px;margin:6px 0 2px;}
.head p{font-size:13px;color:var(--dim);margin:0;}
.scroll{overflow-x:auto;}
svg{display:block;width:100%;height:auto;min-width:760px;}
.lbl{font:800 15px -apple-system,"Segoe UI",Arial,sans-serif;fill:var(--ink);}
.cap{font:700 13px -apple-system,"Segoe UI",Arial,sans-serif;fill:var(--ink);}
.brandline{stroke:var(--ink);stroke-width:2.4;fill:none;}
.node{fill:var(--ink);}
.dim{opacity:.28;} /* not-yet-built state */
</style></head>
<body><div class="wrap">
<div class="head">
  <div class="eye">WeGrowPeople &middot; Today's Build</div>
  <h1>Your AI System</h1>
  <p>One picture of everything you build today. It fills in as you finish each step.</p>
</div>

<div class="scroll">
<svg viewBox="0 0 1180 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AI system diagram">
  <defs>
    <!-- ===== BRAIN + CIRCUIT + CHIP (reusable) ===== -->
    <g id="brain">
      <!-- outline -->
      <path d="M0,-70 C-26,-92 -70,-84 -80,-52 C-104,-46 -104,-14 -86,-2
               C-100,10 -92,44 -66,48 C-60,74 -22,80 0,64
               C22,80 60,74 66,48 C92,44 100,10 86,-2
               C104,-14 104,-46 80,-52 C70,-84 26,-92 0,-70 Z"
            fill="#fff" stroke="currentColor" stroke-width="8" stroke-linejoin="round"/>
      <!-- centre split -->
      <line x1="0" y1="-70" x2="0" y2="64" stroke="currentColor" stroke-width="6"/>
      <!-- a few circuit traces + dots -->
      <g stroke="currentColor" stroke-width="4.5" fill="none" stroke-linecap="round">
        <path d="M-34,-30 H-58 M-40,0 H-64 M-34,30 H-56 M34,-30 H58 M40,0 H64 M34,30 H56"/>
        <path d="M-20,-46 V-64 M20,-46 V-64 M-20,46 V62 M20,46 V62"/>
      </g>
      <g fill="currentColor">
        <circle cx="-62" cy="-30" r="4.5"/><circle cx="-68" cy="0" r="4.5"/><circle cx="-60" cy="30" r="4.5"/>
        <circle cx="62" cy="-30" r="4.5"/><circle cx="68" cy="0" r="4.5"/><circle cx="60" cy="30" r="4.5"/>
        <circle cx="-20" cy="-66" r="4.5"/><circle cx="20" cy="-66" r="4.5"/>
        <circle cx="-20" cy="64" r="4.5"/><circle cx="20" cy="64" r="4.5"/>
      </g>
      <!-- chip -->
      <rect x="-30" y="-30" width="60" height="60" rx="6" fill="currentColor"/>
    </g>

    <!-- ===== SKILL badge (reusable) ===== -->
    <g id="skill">
      <circle r="34" fill="#fff" stroke="currentColor" stroke-width="4"/>
      <path d="M 24,-24 A 34 34 0 1 1 -30,-16" fill="none" stroke="currentColor" stroke-width="4"
            stroke-dasharray="3 6" stroke-linecap="round"/>
      <path d="M22,-30 L30,-22 L20,-14" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="0" y="6" text-anchor="middle" font="900 15px Arial" font-family="Arial" font-weight="900" font-size="15" fill="currentColor" letter-spacing="1">SKILL</text>
    </g>

    <!-- ===== document (Claude.md) ===== -->
    <g id="doc">
      <path d="M0,0 H44 L64,20 V96 H0 Z" fill="#fff" stroke="currentColor" stroke-width="5" stroke-linejoin="round"/>
      <path d="M44,0 V20 H64" fill="none" stroke="currentColor" stroke-width="5" stroke-linejoin="round"/>
      <g stroke="currentColor" stroke-width="4" stroke-linecap="round">
        <line x1="14" y1="42" x2="50" y2="42"/><line x1="14" y1="56" x2="50" y2="56"/>
        <line x1="14" y1="70" x2="42" y2="70"/>
      </g>
    </g>
  </defs>

  <!-- ================= CONNECTOR LINES (behind) ================= -->
  <!-- claude.md -> brain -->
  <g id="l-doc"><line x1="470" y1="470" x2="470" y2="470"/></g>
  <!-- we draw the visible lines explicitly below so they sit correctly -->

  <!-- doc arrow -->
  <g stroke="currentColor" stroke-width="5" fill="currentColor" stroke-linecap="round">
    <line x1="250" y1="470" x2="440" y2="370"/>
    <path d="M440,370 l-20,2 l8,-17 z" stroke="none"/>
  </g>

  <!-- skills arrows down into brain -->
  <g stroke="currentColor" stroke-width="5" fill="currentColor" fill-rule="nonzero" stroke-linecap="round">
    <path d="M452,140 C452,200 470,215 500,250" fill="none"/>
    <path d="M500,250 l-16,-9 l0,18 z" stroke="none"/>
    <path d="M628,140 C628,200 610,215 585,250" fill="none"/>
    <path d="M585,250 l16,-9 l0,18 z" stroke="none"/>
  </g>

  <!-- connectors hub (left) -->
  <g class="brandline">
    <line x1="150" y1="215" x2="300" y2="320"/>
    <line x1="150" y1="320" x2="300" y2="320"/>
    <line x1="150" y1="425" x2="300" y2="320"/>
    <line x1="300" y1="320" x2="460" y2="330"/>
  </g>
  <g class="node">
    <circle cx="150" cy="215" r="7"/><circle cx="150" cy="320" r="7"/><circle cx="150" cy="425" r="7"/>
    <circle cx="300" cy="320" r="8"/><circle cx="460" cy="330" r="7"/>
  </g>

  <!-- sub-agents hub (right) -->
  <g class="brandline">
    <line x1="660" y1="330" x2="800" y2="330"/>
    <line x1="800" y1="330" x2="905" y2="255"/>
    <line x1="800" y1="330" x2="905" y2="330"/>
    <line x1="800" y1="330" x2="905" y2="405"/>
  </g>
  <g class="node">
    <circle cx="660" cy="330" r="7"/><circle cx="800" cy="330" r="8"/>
    <circle cx="905" cy="255" r="6"/><circle cx="905" cy="405" r="6"/>
  </g>

  <!-- sub-agents -> output -->
  <g class="brandline">
    <line x1="960" y1="255" x2="1030" y2="330"/>
    <line x1="960" y1="405" x2="1030" y2="330"/>
    <line x1="1030" y1="330" x2="1075" y2="330"/>
  </g>
  <g class="node"><circle cx="1030" cy="330" r="8"/></g>

  <!-- ================= ELEMENTS ================= -->

  <!-- AI BRAIN (centre) -->
  <g transform="translate(560,320)" color="#17170f"><use href="#brain"/></g>
  <text class="lbl" x="560" y="430" text-anchor="middle" font-size="22" font-weight="900">AI BRAIN</text>

  <!-- Claude.md -->
  <g transform="translate(150,470)" color="#17170f"><use href="#doc"/></g>
  <text class="cap" x="182" y="596" text-anchor="middle">Claude.md</text>

  <!-- SKILL badges -->
  <g transform="translate(452,90)" color="#17170f"><use href="#skill"/></g>
  <g transform="translate(628,90)" color="#17170f"><use href="#skill"/></g>

  <!-- Connectors/MCP label -->
  <text class="lbl" x="40" y="130" font-size="17" font-weight="900">Connectors/MCP</text>

  <!-- === logos (simplified, on-brand) === -->
  <!-- Google Calendar -->
  <g transform="translate(28,180)">
    <rect x="0" y="0" width="52" height="52" rx="9" fill="#fff" stroke="#dcd7c8" stroke-width="1.5"/>
    <rect x="0" y="0" width="52" height="14" rx="9" fill="#4285F4"/><rect x="0" y="7" width="52" height="8" fill="#4285F4"/>
    <rect x="6" y="6" width="10" height="10" fill="#EA4335"/><rect x="36" y="6" width="10" height="10" fill="#FBBC05"/>
    <rect x="6" y="36" width="10" height="10" fill="#34A853"/>
    <text x="26" y="40" text-anchor="middle" font-family="Arial" font-weight="800" font-size="18" fill="#4285F4">31</text>
  </g>
  <!-- Google Sheets -->
  <g transform="translate(112,180)">
    <rect x="4" y="0" width="44" height="52" rx="7" fill="#0F9D58"/>
    <rect x="12" y="14" width="28" height="26" rx="2" fill="#fff"/>
    <g stroke="#0F9D58" stroke-width="2"><line x1="12" y1="23" x2="40" y2="23"/><line x1="12" y1="31" x2="40" y2="31"/><line x1="26" y1="14" x2="26" y2="40"/></g>
  </g>
  <!-- Gmail -->
  <g transform="translate(196,180)">
    <rect x="0" y="4" width="52" height="44" rx="7" fill="#fff" stroke="#e6e1d4" stroke-width="1.5"/>
    <path d="M4,14 L26,30 L48,14" fill="none" stroke="#EA4335" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M4,14 V44 M48,14 V44" stroke="#EA4335" stroke-width="6" stroke-linecap="round"/>
  </g>
  <!-- Salesforce -->
  <g transform="translate(24,290)">
    <path d="M30,14 a12,12 0 0 1 22,4 a11,11 0 0 1 -3,21 H16 a12,12 0 0 1 -2,-24 a13,13 0 0 1 16,-1 Z" fill="#00A1E0"/>
  </g>
  <!-- HubSpot -->
  <g transform="translate(110,296)">
    <circle cx="26" cy="26" r="9" fill="none" stroke="#FF7A59" stroke-width="5"/>
    <circle cx="26" cy="4" r="4" fill="#FF7A59"/><line x1="26" y1="8" x2="26" y2="17" stroke="#FF7A59" stroke-width="4"/>
    <circle cx="44" cy="16" r="5" fill="#FF7A59"/><line x1="34" y1="22" x2="40" y2="18" stroke="#FF7A59" stroke-width="4"/>
  </g>
  <!-- Shopify -->
  <g transform="translate(24,398)">
    <path d="M14,10 h20 l6,40 h-32 z" fill="#95BF47"/>
    <text x="24" y="40" text-anchor="middle" font-family="Arial" font-weight="900" font-size="20" fill="#fff">S</text>
  </g>
  <!-- Xero -->
  <g transform="translate(112,398)">
    <circle cx="26" cy="26" r="24" fill="#13B5EA"/>
    <text x="26" y="34" text-anchor="middle" font-family="Arial" font-weight="800" font-size="22" fill="#fff">X</text>
  </g>
  <!-- QuickBooks -->
  <g transform="translate(196,398)">
    <circle cx="26" cy="26" r="24" fill="#2CA01C"/>
    <text x="26" y="34" text-anchor="middle" font-family="Arial" font-weight="800" font-size="17" fill="#fff">qb</text>
  </g>

  <!-- Sub Agents -->
  <text class="lbl" x="905" y="205" text-anchor="middle" font-size="15" font-weight="900">Sub Agents</text>
  <g transform="translate(905,255) scale(.34)" color="#17170f"><use href="#brain"/></g>
  <g transform="translate(905,330) scale(.34)" color="#17170f"><use href="#brain"/></g>
  <g transform="translate(905,405) scale(.34)" color="#17170f"><use href="#brain"/></g>

  <!-- Schedule -->
  <g transform="translate(868,470)" color="#17170f">
    <circle cx="16" cy="20" r="16" fill="#fff" stroke="currentColor" stroke-width="4"/>
    <line x1="16" y1="20" x2="16" y2="10" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="16" y1="20" x2="24" y2="24" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/>
    <rect x="30" y="14" width="40" height="34" rx="4" fill="#fff" stroke="currentColor" stroke-width="4"/>
    <line x1="30" y1="24" x2="70" y2="24" stroke="currentColor" stroke-width="3"/>
    <line x1="40" y1="10" x2="40" y2="18" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="60" y1="10" x2="60" y2="18" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/>
    <g fill="currentColor"><rect x="36" y="30" width="6" height="6"/><rect x="48" y="30" width="6" height="6"/><rect x="58" y="30" width="6" height="6"/><rect x="36" y="40" width="6" height="6"/><rect x="48" y="40" width="6" height="6"/></g>
  </g>
  <text class="cap" x="905" y="548" text-anchor="middle">Schedule</text>

  <!-- Output (dashboard) -->
  <g transform="translate(1075,285)" color="#17170f">
    <rect x="0" y="0" width="90" height="90" rx="8" fill="#fff" stroke="currentColor" stroke-width="5"/>
    <line x1="0" y1="20" x2="90" y2="20" stroke="currentColor" stroke-width="5"/>
    <g fill="currentColor"><circle cx="12" cy="10" r="3"/><circle cx="24" cy="10" r="3"/><circle cx="36" cy="10" r="3"/></g>
    <path d="M30,66 A20,20 0 0 1 30,34 V50 Z" fill="currentColor"/>
    <path d="M30,34 A20,20 0 0 1 50,54 H30 Z" fill="currentColor" opacity=".55"/>
    <g fill="currentColor"><rect x="58" y="52" width="7" height="16"/><rect x="69" y="42" width="7" height="26"/><rect x="80" y="34" width="7" height="34"/></g>
  </g>
  <text class="cap" x="1120" y="398" text-anchor="middle">Output</text>

</svg>
</div>
</div></body></html>
